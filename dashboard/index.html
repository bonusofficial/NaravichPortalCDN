<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Naravich Sure CDN Manager — internal console for the self-hosted image storage server." />
    <meta name="theme-color" content="#ffffff" />
    <title>Naravich Sure · CDN Manager</title>
    <script>
      // Resolve the saved theme before first paint to avoid a light/dark flash.
      (function () {
        try {
          var pref = localStorage.getItem('ncdn-theme') || 'light';
          var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
